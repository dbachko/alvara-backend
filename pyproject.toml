[project]
name = "alvara-backend"
version = "0.1.0"
description = "Local-safe legacy Alvara metadata and image renderer"
requires-python = ">=3.11,<3.15"
dependencies = [
    "aiohttp==3.14.5",
    "web3==8.0.0",
    "Pillow==13.0.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]
